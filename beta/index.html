<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MGS | FOXHOUND TACTICAL TERMINAL</title>
    <style>
        :root {
            --mgs-green: #5b6d5b;
            --mgs-light-green: #a8bfa8;
            --mgs-orange: #ff8000;
            --mgs-black: #0a0c0a;
            --mgs-dark-grey: #1a1d1a;
            --font-main: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--mgs-black);
            color: var(--mgs-light-green);
            font-family: var(--font-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-transform: uppercase;
            overflow: hidden;
        }

        /* CRT SCANLINES & NOISE */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 1000;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
            opacity: 0.3;
        }

        /* HLAVNÍ TERMINÁL */
        .terminal {
            border: 4px solid var(--mgs-green);
            background: var(--mgs-dark-grey);
            padding: 40px;
            width: 90%;
            max-width: 650px;
            position: relative;
            box-shadow: 0 0 20px rgba(91, 109, 91, 0.5), inset 0 0 10px rgba(0,0,0,0.8);
            z-index: 10;
        }

        /* DEKORATIVNÍ ROHY */
        .terminal::before {
            content: "TOP SECRET";
            position: absolute;
            top: -25px; left: 0;
            background: var(--mgs-orange);
            color: black;
            padding: 2px 10px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .header {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid var(--mgs-orange);
            margin-bottom: 30px;
            padding-bottom: 10px;
        }

        .codec-ui {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .codec-portrait {
            width: 80px;
            height: 100px;
            border: 2px solid var(--mgs-green);
            background: linear-gradient(to bottom, #111, #333);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .frequency {
            color: var(--mgs-orange);
            font-weight: bold;
            font-size: 1.2rem;
            text-shadow: 0 0 5px var(--mgs-orange);
        }

        /* INPUTY */
        input {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--mgs-green);
            color: var(--mgs-orange);
            padding: 15px;
            font-family: var(--font-main);
            width: 100%;
            box-sizing: border-box;
            outline: none;
            font-size: 1.3rem;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: inset 0 0 5px rgba(91, 109, 91, 0.5);
        }

        .btn {
            background: var(--mgs-green);
            color: var(--mgs-black);
            border: none;
            padding: 15px;
            cursor: pointer;
            font-weight: bold;
            font-family: var(--font-main);
            width: 100%;
            transition: all 0.2s;
            font-size: 1rem;
            letter-spacing: 2px;
        }

        .btn:hover {
            background: var(--mgs-light-green);
            box-shadow: 0 0 15px var(--mgs-light-green);
        }

        /* STAVOVÉ BLOKY */
        #search-block { display: none; animation: boot 0.4s steps(4); }

        @keyframes boot {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .footer-tags {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            font-size: 0.6rem;
            color: var(--mgs-green);
        }
    </style>
</head>
<body>

<div class="terminal" id="mainTerminal">
    <div class="header">
        <div id="status-text">SYSTEM: STANDBY</div>
        <div>STN-772 / OP: SNAKE</div>
    </div>

    <div class="codec-ui">
        <div class="codec-portrait">
            <div style="font-size: 0.5rem; text-align: center;">NO SIGNAL</div>
        </div>
        <div class="frequency">140.85</div>
        <div class="codec-portrait">
            <div style="font-size: 0.5rem; text-align: center;">ENCRYPTED</div>
        </div>
    </div>

    <div id="lock-block">
        <p style="margin-bottom: 10px; color: var(--mgs-orange);">ENTER DECRYPTION KEY:</p>
        <input type="text" id="passInput" placeholder="---" maxlength="3" autocomplete="off">
        <button class="btn" onclick="authorize()">EXECUTE AUTHORIZATION</button>
    </div>

    <div id="search-block">
        <p style="margin-bottom: 10px; color: var(--mgs-light-green);">LINK ESTABLISHED - GOOGLE SEARCH ENGINE</p>
        <input type="text" id="queryInput" placeholder="SEARCH FOR INTEL...">
        <button class="btn" onclick="search()">START DATA EXTRACTION</button>
    </div>

    <div class="footer-tags">
        <span>© PHILANTHROPY 2026</span>
        <span>NO PLACE FOR HIDEO</span>
    </div>
</div>

<script>
    // Ověření kódu 123
    function authorize() {
        const val = document.getElementById('passInput').value;
        const status = document.getElementById('status-text');
        
        if (val === "123") {
            status.innerText = "SYSTEM: AUTHORIZED";
            status.style.color = "var(--mgs-orange)";
            
            // "Zásek" pro efekt dekódování
            document.getElementById('lock-block').style.opacity = "0.5";
            
            setTimeout(() => {
                document.getElementById('lock-block').style.display = 'none';
                document.getElementById('search-block').style.display = 'block';
                document.getElementById('queryInput').focus();
            }, 400);
        } else {
            status.innerText = "ERROR: ACCESS DENIED";
            status.style.color = "red";
            document.getElementById('passInput').value = "";
            
            // Otřes terminálu při chybě
            const term = document.getElementById('mainTerminal');
            term.style.transform = "translateX(5px)";
            setTimeout(() => term.style.transform = "translateX(-5px)", 50);
            setTimeout(() => term.style.transform = "translateX(0)", 100);
        }
    }

    // Vyhledávání
    function search() {
        const q = document.getElementById('queryInput').value;
        if (q.trim() !== "") {
            window.location.href = "https://www.google.com/search?q=" + encodeURIComponent(q);
        }
    }

    // Podpora Enteru
    document.getElementById('passInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') authorize();
    });
    document.getElementById('queryInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') search();
    });
</script>

</body>
</html>
