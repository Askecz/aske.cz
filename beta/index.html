<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MGS | Tactical Search Console</title>
    <style>
        :root {
            --mgs-green: #5b6d5b;
            --mgs-light-green: #a8bfa8;
            --mgs-orange: #ff8000;
            --mgs-black: #0a0c0a;
            --mgs-dark-grey: #1a1d1a;
            --font-main: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--mgs-black);
            color: var(--mgs-light-green);
            font-family: var(--font-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-transform: uppercase;
            overflow: hidden;
        }

        /* CRT Scanline efekt */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 255, 0, 0.06));
            z-index: 100;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        .codec-frame {
            border: 3px solid var(--mgs-green);
            background-color: var(--mgs-dark-grey);
            padding: 40px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 0 30px rgba(91, 109, 91, 0.2);
            position: relative;
            z-index: 10;
        }

        .header {
            border-bottom: 2px solid var(--mgs-green);
            margin-bottom: 20px;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
        }

        h2 {
            color: var(--mgs-orange);
            font-size: 1.1rem;
            margin-top: 0;
        }

        input {
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--mgs-green);
            color: var(--mgs-orange);
            padding: 15px;
            font-family: var(--font-main);
            width: 100%;
            box-sizing: border-box;
            outline: none;
            font-size: 1.1rem;
            text-align: center;
            letter-spacing: 2px;
        }

        .btn {
            margin-top: 20px;
            background: var(--mgs-green);
            color: var(--mgs-black);
            border: none;
            padding: 12px 25px;
            cursor: pointer;
            font-weight: bold;
            font-family: var(--font-main);
            width: 100%;
            transition: 0.2s;
        }

        .btn:hover {
            background: var(--mgs-light-green);
        }

        #search-section {
            display: none; /* Skryté do zadání kódu */
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer-info {
            margin-top: 20px;
            font-size: 0.7rem;
            color: #444;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="codec-frame">
    <div class="header">
        <span>STN: DIS-093</span>
        <span>FREQ: 140.85</span>
    </div>

    <div id="login-section">
        <h2>ENTER ACCESS CODE</h2>
        <input type="password" id="passcode" placeholder="***" maxlength="3">
        <button class="btn" onclick="verifyAccess()">AUTHORIZE</button>
        <p id="error-msg" style="color: red; font-size: 0.8rem; margin-top: 10px; height: 1rem;"></p>
    </div>

    <div id="search-section">
        <h2 style="color: var(--mgs-light-green);">DATA LINK ESTABLISHED</h2>
        <p style="font-size: 0.8rem; margin-bottom: 15px;">TARGET: GLOBAL INFORMATION NETWORK (GOOGLE)</p>
