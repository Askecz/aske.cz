<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MGS | Tactical Search Console</title>
    <style>
        :root {
            --mgs-green: #5b6d5b;
            --mgs-light-green: #a8bfa8;
            --mgs-orange: #ff8000;
            --mgs-black: #0a0c0a;
            --mgs-dark-grey: #1a1d1a;
            --font-main: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--mgs-black);
            color: var(--mgs-light-green);
            font-family: var(--font-main);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-transform: uppercase;
            overflow: hidden;
        }

        /* CRT Scanline efekt */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 255, 0, 0.06));
            z-index: 100;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        .codec-frame {
            border: 3px solid var(--mgs-green);
            background-color: var(--mgs-dark-grey);
            padding: 40px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 0 30px rgba(91, 109, 91, 0.2);
            z-index: 10;
            text-align: center;
        }

        h2 { color: var(--mgs-orange); font-size: 1.1rem; margin-top: 0; }

        input {
            background: rgba(0,0,0,0.7);
            border: 1px solid var(--mgs-green);
            color: var(--mgs-orange);
            padding: 15px;
            font-family: var(--font-main);
            width: 100%;
            box-sizing: border-box;
            outline: none;
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 15px;
        }

        .btn {
            background: var(--mgs-green);
            color: var(--mgs-black);
            border: none;
            padding: 12px;
            cursor: pointer;
            font-weight: bold;
            font-family: var(--font-main);
            width: 100%;
            text-transform: uppercase;
        }

        .btn:hover { background: var(--mgs-light-green); }

        #search-section { display: none; }

        .success-flash { animation: flash 0.3s; }
        @keyframes flash {
            50% { background-color: var(--mgs-green); }
        }
    </style>
</head>
<body>

<div class="codec-frame" id="mainFrame">
    <div id="login-section">
        <h2>IDENTIFICATION REQUIRED</h2>
        <input type="text" id="passcode" placeholder="ENTER CODE" maxlength="3" autocomplete="off">
        <button type="button" class="btn" onclick="verify()">AUTHORIZE</button>
        <p id="status" style="font-size: 0.7rem; margin-top: 10px;">AWAITING SIGNAL...</p>
    </div>

    <div id="search-section">
        <h2 style="color: var(--mgs-light-green);">ACCESS GRANTED</h2>
        <input type="text" id="query" placeholder="SEARCH GOOGLE INTEL...">
        <button type="button" class="btn" onclick="doSearch()">EXECUTE SEARCH</button>
        <p style="font-size: 0.7rem; margin-top: 10px; color: var(--mgs-green);">CONNECTED TO GLOBAL NET</p>
    </div>
</div>

<script>
    // Funkce pro ověření kódu
    function verify() {
        const val = document.getElementById('passcode').value;
        const frame = document.getElementById('mainFrame');
        
        if (val === "123") {
            // Efekt úspěchu
            frame.classList.add('success-flash');
            
            setTimeout(() => {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('search-section').style.display = 'block';
                document.getElementById('query').focus();
            }, 300);
        } else {
            document.getElementById('status').innerText = "INVALID CODE - ACCESS DENIED";
            document.getElementById('status').style.color = "red";
            document.getElementById('passcode').value = "";
        }
    }

    // Funkce pro vyhledávání
    function doSearch() {
        const q = document.getElementById('query').value;
        if (q.trim() !== "") {
            window.location.href = "https://www.google.com/search?q=" + encodeURIComponent(q);
        }
    }

    // Podpora klávesy Enter pro obě pole
    document.getElementById('passcode').addEventListener('keyup', function(e) {
        if (e.key === 'Enter') verify();
    });

    document.getElementById('query').addEventListener('keyup', function(e) {
        if (e.key === 'Enter') doSearch();
    });
</script>

</body>
</html>
