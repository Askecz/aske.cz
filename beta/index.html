<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MGS | Secure Gateway</title>
    <style>
        :root {
            --mgs-green: #5b6d5b;
            --mgs-light-green: #a8bfa8;
            --mgs-orange: #ff8000;
            --mgs-black: #0a0c0a;
            --mgs-dark-grey: #1a1d1a;
            --font-main: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--mgs-black);
            color: var(--mgs-light-green);
            font-family: var(--font-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            text-transform: uppercase;
            overflow: hidden;
        }

        /* Scanline efekt */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 10;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        .terminal-container {
            border: 2px solid var(--mgs-green);
            padding: 30px;
            background-color: var(--mgs-dark-grey);
            width: 100%;
            max-width: 500px;
            box-shadow: 0 0 20px rgba(91, 109, 91, 0.4);
            text-align: center;
            position: relative;
        }

        h1 {
            color: var(--mgs-orange);
            font-size: 1.2rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .status-line {
            font-size: 0.8rem;
            margin-bottom: 20px;
            color: var(--mgs-green);
            border-bottom: 1px solid var(--mgs-green);
            padding-bottom: 10px;
        }

        input {
            background: transparent;
            border: 1px solid var(--mgs-green);
            color: var(--mgs-orange);
            padding: 15px;
            font-family: var(--font-main);
            outline: none;
            width: 80%;
            text-align: center;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        button {
            background: var(--mgs-green);
            color: var(--mgs-black);
            border: none;
            padding: 10px 30px;
            cursor: pointer;
            font-weight: bold;
            font-family: var(--font-main);
            transition: 0.3s;
        }

        button:hover {
            background: var(--mgs-light-green);
            box-shadow: 0 0 10px var(--mgs-light-green);
        }

        #msg {
            margin-top: 20px;
            font-size: 0.9rem;
            height: 1.2rem;
        }

        .loading-bar {
            width: 0%;
            height: 4px;
            background: var(--mgs-orange);
            margin-top: 10px;
            transition: width 0.5s;
        }
    </style>
</head>
<body>

<div class="terminal-container">
    <div class="status-line">CLASSIFIED DATA ACCESS | FREQ: 140.85</div>
    <h1>IDENTIFICATION REQUIRED</h1>
    
    <input type="password" id="passcode" placeholder="ENTER CODE" maxlength="3" onkeypress="handleKeyPress(event)">
    <br>
    <button onclick="checkCode()">VERIFY</button>

    <div id="msg">AWAITING INPUT...</div>
    <div id="loader" class="loading-bar"></div>
</div>

<script>
    function handleKeyPress(e) {
        if (e.key === 'Enter') checkCode();
    }

    function checkCode() {
        const code = document.getElementById('passcode').value;
        const msg = document.getElementById('msg');
        const loader = document.getElementById('loader');

        if (code === "123") {
            msg.style.color = "var(--mgs-light-green)";
            msg.innerText = "ACCESS GRANTED. REDIRECTING...";
            loader.style.width = "100%";
            
            // Simulace přenosu dat před přesměrováním
            setTimeout(() => {
                window.location.href = "https://aske.cz/";
            }, 1500);
        } else {
            msg.style.color = "red";
            msg.innerText = "ACCESS DENIED. INVALID CODE.";
            document.getElementById('passcode').value = "";
            
            // Krátký efekt otřesu při chybě
            document.querySelector('.terminal-container').style.borderColor = "red";
            setTimeout(() => {
                document.querySelector('.terminal-container').style.borderColor = "var(--mgs-green)";
            }, 500);
        }
    }
</script>

</body>
</html>
