<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aske | Na webu se pracuje</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 4rem;
            margin: 0;
            letter-spacing: 5px;
            color: #58a6ff;
            text-transform: uppercase;
        }

        p {
            font-size: 1.2rem;
            color: #8b949e;
            margin-top: 10px;
        }

        .loader {
            margin: 30px auto;
            width: 40px;
            height: 40px;
            border: 3px solid #30363d;
            border-top: 3px solid #58a6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.8rem;
            color: #484f58;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Aske</h1>
        <div class="loader"></div>
        <p>Na webu se momentálně pracuje...</p>
    </div>

    <div class="footer">
        &copy; 2026 Aske
    </div>

</body>
</html>
